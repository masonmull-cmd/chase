<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P&L Calendar Journal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      min-height: 100vh;
      background-image: url('https://cdn.discordapp.com/attachments/603275416807014469/1515172370875158638/GOmrTckWgAIdWKb.png?ex=6a2e09bb&is=6a2cb83b&hm=7172c117816008c981d0fc9a4ef7854691e30595c4f1ef8f38d2d08a51bb281f&');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: -1;
    }

    h1, h2 {
      text-align: center;
      color: #e7e7e7;
      font-weight: 600;
      letter-spacing: 1px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      margin: 4px;
      background: rgba(255,255,255,0.88);
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: white;
    }

    input, textarea, select {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
      outline: none;
    }

    .login-page {
      max-width: 360px;
      margin: 120px auto;
      text-align: center;
      background: rgba(10,10,10,0.48);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }

    #loginError {
      color: #ff4d4d;
      font-weight: bold;
    }

    #app {
      display: none;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 16px;
      background: rgba(10,10,10,0.45);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255,255,255,0.10);
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .nav-item {
      display: block;
      padding: 12px 14px;
      margin: 8px 0;
      border-radius: 12px;
      color: #eaeaea;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      text-decoration: none;
      font-weight: bold;
    }

    .nav-item:hover {
      background: rgba(255,255,255,0.12);
    }

    .logout-btn {
      width: 100%;
      background: rgba(255,77,77,0.85);
      color: white;
      margin-top: 18px;
    }

    .main {
      padding: 24px;
      overflow-x: hidden;
    }

    .header {
      background: rgba(10,10,10,0.42);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.20);
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat, .panel, .box {
      background: rgba(10,10,10,0.40);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      box-shadow: 0 14px 40px rgba(0,0,0,0.22);
    }

    .stat {
      padding: 16px;
      text-align: center;
    }

    .stat h3 {
      margin: 0;
      color: #bdbdbd;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .stat p {
      font-size: 23px;
      margin: 8px 0 0;
      font-weight: bold;
    }

    .top {
      display: flex;
      justify-content: center;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .total {
      text-align: center;
      font-size: 25px;
      margin-bottom: 18px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
    }

    .calendar-wrap {
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, minmax(140px, 1fr));
      gap: 10px;
      min-width: 980px;
    }

    .day-name {
      text-align: center;
      font-weight: bold;
      color: #e0e0e0;
      padding: 10px;
      background: rgba(10,10,10,0.28);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
    }

    .day {
      background: rgba(10,10,10,0.45);
      backdrop-filter: blur(4px);
      min-height: 140px;
      border-radius: 14px;
      padding: 11px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
      transition: 0.2s ease;
      position: relative;
    }

    .day:hover {
      transform: translateY(-3px);
      background: rgba(15,15,15,0.58);
      border-color: rgba(255,255,255,0.18);
    }

    .day.positive {
      background: rgba(0,210,106,0.12);
      border: 1px solid rgba(0,210,106,0.35);
      box-shadow: inset 0 0 28px rgba(0,210,106,0.08);
    }

    .day.negative {
      background: rgba(255,77,77,0.12);
      border: 1px solid rgba(255,77,77,0.35);
      box-shadow: inset 0 0 28px rgba(255,77,77,0.08);
    }

    .today {
      border: 2px solid rgba(255,255,255,0.9) !important;
    }

    .date {
      font-weight: bold;
      margin-bottom: 8px;
      color: #f1f1f1;
    }

    .day-total {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .day-count {
      position: absolute;
      top: 30px;
      right: 10px;
      font-size: 11px;
      color: #cfcfcf;
    }

    .profit {
      color: #00d26a;
      font-weight: bold;
    }

    .loss {
      color: #ff4d4d;
      font-weight: bold;
    }

    .entry {
      font-size: 12.5px;
      margin-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.10);
      padding-top: 6px;
      color: #eeeeee;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      justify-content: center;
      align-items: center;
      z-index: 99;
      padding: 18px;
    }

    .box {
      width: 390px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .panel {
      padding: 18px;
    }

    canvas {
      width: 100%;
      background: rgba(10,10,10,0.35);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(53, 1fr);
      gap: 3px;
      margin-top: 10px;
    }

    .heat-cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(90,90,90,0.35);
      border-radius: 3px;
    }

    .img-preview {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    .file-input {
      max-width: 230px;
      background: rgba(255,255,255,0.9);
      color: #111;
      padding: 8px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: relative;
        height: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .brand {
        width: 100%;
        margin-bottom: 6px;
      }

      .nav-item {
        margin: 0;
      }

      .logout-btn {
        width: auto;
        margin-top: 0;
      }

      .main {
        padding: 16px;
      }
    }

    @media (max-width: 700px) {
      .calendar {
        min-width: 0;
        grid-template-columns: repeat(2, 1fr);
      }

      .day-name {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="loginPage" class="login-page">
    <h1>Login</h1>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="loginError"></p>
  </div>

  <div id="app">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">VizaTrades</div>
        <a class="nav-item" href="#dashboard">Dashboard</a>
        <a class="nav-item" href="#calendarSection">Calendar</a>
        <a class="nav-item" href="#chartsSection">Charts</a>
        <a class="nav-item" href="#heatmapSection">Heatmap</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </aside>

      <main class="main">
        <section class="header">
          <h1>P&L Calendar Journal</h1>

          <div class="top">
            <button onclick="changeMonth(-1)">← Prev</button>
            <h2 id="monthYear"></h2>
            <button onclick="changeMonth(1)">Next →</button>
            <button onclick="goToday()">Today</button>
            <button onclick="exportData()">Export JSON</button>
            <input class="file-input" type="file" id="importFile" onchange="importData(event)">
          </div>
        </section>

        <section id="dashboard" class="dashboard">
          <div class="stat"><h3>Total P&L</h3><p id="statTotal">$0</p></div>
          <div class="stat"><h3>Total Entries</h3><p id="statEntries">0</p></div>
          <div class="stat"><h3>Wins</h3><p id="statWins">0</p></div>
          <div class="stat"><h3>Losses</h3><p id="statLosses">0</p></div>
          <div class="stat"><h3>Win %</h3><p id="statWinRate">0%</p></div>
          <div class="stat"><h3>Current Streak</h3><p id="statStreak">0</p></div>
        </section>

        <section id="calendarSection">
          <div class="total" id="monthlyTotal"></div>
          <div class="calendar-wrap">
            <div class="calendar" id="calendar"></div>
          </div>
        </section>

        <section id="chartsSection" class="charts">
          <div class="panel">
            <h2>Monthly Graph</h2>
            <canvas id="monthlyChart" width="500" height="250"></canvas>
          </div>

          <div id="heatmapSection" class="panel">
            <h2>Year Heatmap</h2>
            <div class="heatmap" id="heatmap"></div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="box">
      <h2 id="selectedDateText"></h2>

      <input id="eventInput" placeholder="Entry title" />
      <select id="resultInput">
        <option value="Win">Win</option>
        <option value="Loss">Loss</option>
        <option value="Push">Push</option>
        <option value="Void">Void</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <input id="plInput" type="number" placeholder="P&L, ex: 50 or -25" />
      <textarea id="notesInput" placeholder="Notes"></textarea>
      <input id="imageInput" type="file" accept="image/*" />

      <button onclick="saveEntry()">Save Entry</button>
      <button onclick="closeModal()">Close</button>

      <div id="dayEntries"></div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDate = null;
    let entries = JSON.parse(localStorage.getItem("journalEntries")) || {};

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === "1" && pass === "1") {
        localStorage.setItem("loggedIn", "true");
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "block";
        renderAll();
      } else {
        document.getElementById("loginError").textContent = "Wrong username or password";
      }
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      document.getElementById("loginPage").style.display = "block";
      document.getElementById("app").style.display = "none";
    }

    function checkLogin() {
      if (localStorage.getItem("loggedIn") === "true") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "block";
        renderAll();
      }
    }

    function renderAll() {
      renderCalendar();
      renderStats();
      renderChart();
      renderHeatmap();
    }

    function getDateKey(year, month, day) {
      return `${year}-${month + 1}-${day}`;
    }

    function renderCalendar() {
      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById("monthYear").textContent =
        `${currentDate.toLocaleString("default", { month: "long" })} ${year}`;

      ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(day => {
        const div = document.createElement("div");
        div.className = "day-name";
        div.textContent = day;
        calendar.appendChild(div);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement("div"));
      }

      let monthlyTotal = 0;
      const today = new Date();

      for (let day = 1; day <= lastDate; day++) {
        const dateKey = getDateKey(year, month, day);
        const dayBox = document.createElement("div");
        dayBox.className = "day";

        if (
          today.getFullYear() === year &&
          today.getMonth() === month &&
          today.getDate() === day
        ) {
          dayBox.classList.add("today");
        }

        dayBox.onclick = () => openModal(dateKey);

        let dayTotal = 0;
        let entryCount = 0;

        if (entries[dateKey]) {
          entryCount = entries[dateKey].length;
          entries[dateKey].forEach(entry => {
            dayTotal += Number(entry.pl || 0);
          });
        }

        if (dayTotal > 0) dayBox.classList.add("positive");
        if (dayTotal < 0) dayBox.classList.add("negative");

        monthlyTotal += dayTotal;

        dayBox.innerHTML = `
          <div class="date">${day}</div>
          ${dayTotal !== 0 ? `
            <div class="day-total ${dayTotal >= 0 ? "profit" : "loss"}">
              ${dayTotal >= 0 ? "+" : ""}$${dayTotal}
            </div>
            <div class="day-count">${entryCount} ${entryCount === 1 ? "Entry" : "Entries"}</div>
          ` : ""}
        `;

        if (entries[dateKey]) {
          entries[dateKey].slice(0, 3).forEach(entry => {
            dayBox.innerHTML += `
              <div class="entry">
                ${entry.event || "Entry"}<br>
                ${entry.result || ""}
              </div>
            `;
          });

          if (entries[dateKey].length > 3) {
            dayBox.innerHTML += `<div class="entry">+${entries[dateKey].length - 3} more</div>`;
          }
        }

        calendar.appendChild(dayBox);
      }

      const totalBox = document.getElementById("monthlyTotal");
      totalBox.textContent = `Monthly Total: ${monthlyTotal >= 0 ? "+" : ""}$${monthlyTotal}`;
      totalBox.className = monthlyTotal >= 0 ? "total profit" : "total loss";
    }

    function renderStats() {
      let total = 0;
      let count = 0;
      let wins = 0;
      let losses = 0;

      Object.values(entries).forEach(day => {
        day.forEach(entry => {
          count++;
          total += Number(entry.pl || 0);
          if ((entry.result || "").toLowerCase() === "win") wins++;
          if ((entry.result || "").toLowerCase() === "loss") losses++;
        });
      });

      const winRate = wins + losses > 0 ? Math.round((wins / (wins + losses)) * 100) : 0;

      document.getElementById("statTotal").textContent = `${total >= 0 ? "+" : ""}$${total}`;
      document.getElementById("statTotal").className = total >= 0 ? "profit" : "loss";
      document.getElementById("statEntries").textContent = count;
      document.getElementById("statWins").textContent = wins;
      document.getElementById("statLosses").textContent = losses;
      document.getElementById("statWinRate").textContent = `${winRate}%`;
      document.getElementById("statStreak").textContent = getCurrentStreak();
    }

    function getCurrentStreak() {
      const dates = Object.keys(entries).sort((a, b) => new Date(b) - new Date(a));
      let streak = 0;
      let streakType = null;

      for (const date of dates) {
        let dayTotal = entries[date].reduce((sum, e) => sum + Number(e.pl || 0), 0);

        if (dayTotal === 0) continue;

        const type = dayTotal > 0 ? "win" : "loss";

        if (!streakType) streakType = type;
        if (type === streakType) streak++;
        else break;
      }

      if (streak === 0) return "0";
      return `${streak} ${streakType === "win" ? "green" : "red"}`;
    }

    function openModal(dateKey) {
      selectedDate = dateKey;
      document.getElementById("selectedDateText").textContent = dateKey;
      document.getElementById("modal").style.display = "flex";
      showDayEntries();
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
      document.getElementById("eventInput").value = "";
      document.getElementById("plInput").value = "";
      document.getElementById("notesInput").value = "";
      document.getElementById("imageInput").value = "";
    }

    function saveEntry() {
      const event = document.getElementById("eventInput").value;
      const result = document.getElementById("resultInput").value;
      const pl = document.getElementById("plInput").value || 0;
      const notes = document.getElementById("notesInput").value;
      const imageFile = document.getElementById("imageInput").files[0];

      const newEntry = { event, result, pl, notes, image: "" };

      if (imageFile) {
        const reader = new FileReader();
        reader.onload = function(e) {
          newEntry.image = e.target.result;
          finishSave(newEntry);
        };
        reader.readAsDataURL(imageFile);
      } else {
        finishSave(newEntry);
      }
    }

    function finishSave(newEntry) {
      if (!entries[selectedDate]) entries[selectedDate] = [];
      entries[selectedDate].push(newEntry);
      localStorage.setItem("journalEntries", JSON.stringify(entries));
      closeModal();
      renderAll();
    }

    function showDayEntries() {
      const container = document.getElementById("dayEntries");
      container.innerHTML = "<h3>Entries</h3>";

      if (!entries[selectedDate] || entries[selectedDate].length === 0) {
        container.innerHTML += "<p>No entries yet.</p>";
        return;
      }

      entries[selectedDate].forEach((entry, index) => {
        container.innerHTML += `
          <div class="entry">
            <strong>${entry.event || "Entry"}</strong><br>
            Result: ${entry.result}<br>
            P&L: ${Number(entry.pl) >= 0 ? "+" : ""}$${entry.pl}<br>
            ${entry.notes ? `Notes: ${entry.notes}<br>` : ""}
            ${entry.image ? `<img src="${entry.image}" class="img-preview">` : ""}
            <br><button onclick="deleteEntry('${selectedDate}', ${index})">Delete</button>
          </div>
        `;
      });
    }

    function deleteEntry(dateKey, index) {
      entries[dateKey].splice(index, 1);
      if (entries[dateKey].length === 0) delete entries[dateKey];
      localStorage.setItem("journalEntries", JSON.stringify(entries));
      showDayEntries();
      renderAll();
    }

    function changeMonth(amount) {
      currentDate.setMonth(currentDate.getMonth() + amount);
      renderAll();
    }

    function goToday() {
      currentDate = new Date();
      renderAll();
    }

    function renderChart() {
      const canvas = document.getElementById("monthlyChart");
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const year = currentDate.getFullYear();
      const monthlyTotals = Array(12).fill(0);

      Object.keys(entries).forEach(dateKey => {
        const date = new Date(dateKey);
        if (date.getFullYear() === year) {
          entries[dateKey].forEach(e => {
            monthlyTotals[date.getMonth()] += Number(e.pl || 0);
          });
        }
      });

      const max = Math.max(...monthlyTotals.map(Math.abs), 1);
      const barWidth = canvas.width / 12;

      ctx.font = "12px Arial";
      ctx.textAlign = "center";

      monthlyTotals.forEach((value, i) => {
        const barHeight = Math.abs(value) / max * 90;
        const x = i * barWidth + 10;
        const middle = canvas.height / 2;

        ctx.fillStyle = value >= 0 ? "#00d26a" : "#ff4d4d";
        ctx.fillRect(
          x,
          value >= 0 ? middle - barHeight : middle,
          barWidth - 18,
          barHeight
        );

        ctx.fillStyle = "white";
        ctx.fillText(
          ["J","F","M","A","M","J","J","A","S","O","N","D"][i],
          x + barWidth / 2 - 10,
          canvas.height - 15
        );
      });

      ctx.strokeStyle = "rgba(255,255,255,0.7)";
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
    }

    function renderHeatmap() {
      const heatmap = document.getElementById("heatmap");
      heatmap.innerHTML = "";

      const year = currentDate.getFullYear();
      const start = new Date(year, 0, 1);
      const daysInYear = new Date(year, 11, 31).getDate() === 31 && new Date(year, 1, 29).getMonth() === 1 ? 366 : 365;

      for (let i = 0; i < daysInYear; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);

        const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        let total = 0;

        if (entries[key]) {
          entries[key].forEach(e => total += Number(e.pl || 0));
        }

        const cell = document.createElement("div");
        cell.className = "heat-cell";

        if (total > 0) cell.style.background = "#00d26a";
        if (total < 0) cell.style.background = "#ff4d4d";

        cell.title = `${key}: ${total >= 0 ? "+" : ""}$${total}`;
        heatmap.appendChild(cell);
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "journal-backup.json";
      a.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        entries = JSON.parse(e.target.result);
        localStorage.setItem("journalEntries", JSON.stringify(entries));
        renderAll();
      };
      reader.readAsText(file);
    }

    checkLogin();
  </script>

</body>
</html>
