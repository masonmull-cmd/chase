<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>P&L Calendar Journal</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      padding: 20px;
      background-image: url('https://cdn.discordapp.com/attachments/603275416807014469/1515172370875158638/GOmrTckWgAIdWKb.png?ex=6a2e09bb&is=6a2cb83b&hm=7172c117816008c981d0fc9a4ef7854691e30595c4f1ef8f38d2d08a51bb281f&');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    h1, h2 {
      text-align: center;
    }

    .login-page, .panel, .box {
      background: rgba(20,20,20,0.88);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 20px;
    }

    .login-page {
      max-width: 350px;
      margin: 120px auto;
      text-align: center;
    }

    #app {
      display: none;
    }

    input, textarea, select {
      width: 100%;
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      border: none;
      box-sizing: border-box;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 4px;
    }

    .logout-btn {
      position: fixed;
      top: 15px;
      right: 15px;
      background: #ff4d4d;
      color: white;
    }

    .top {
      display: flex;
      justify-content: center;
      gap: 15px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: rgba(20,20,20,0.82);
      border: 1px solid #333;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .stat h3 {
      margin: 0;
      color: #aaa;
      font-size: 14px;
    }

    .stat p {
      font-size: 22px;
      margin: 8px 0 0;
      font-weight: bold;
    }

    .total {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day-name {
      text-align: center;
      font-weight: bold;
      color: #aaa;
    }

    .day {
      background: rgba(20,20,20,0.82);
      min-height: 115px;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      border: 1px solid #333;
      overflow: hidden;
    }

    .day:hover {
      background: rgba(35,35,35,0.9);
    }

    .today {
      border: 2px solid white;
    }

    .date {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .profit {
      color: #00d26a;
      font-weight: bold;
    }

    .loss {
      color: #ff4d4d;
      font-weight: bold;
    }

    .entry {
      font-size: 13px;
      margin-top: 6px;
      border-top: 1px solid #333;
      padding-top: 5px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 99;
    }

    .box {
      width: 360px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    canvas {
      width: 100%;
      background: rgba(20,20,20,0.82);
      border-radius: 12px;
      border: 1px solid #333;
    }

    .heatmap {
      display: grid;
      grid-template-columns: repeat(53, 1fr);
      gap: 3px;
      margin-top: 10px;
    }

    .heat-cell {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: rgba(80,80,80,0.5);
      border-radius: 3px;
    }

    .img-preview {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    #loginError {
      color: #ff4d4d;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .calendar {
        grid-template-columns: repeat(2, 1fr);
      }

      .day-name {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div id="loginPage" class="login-page">
    <h1>Login</h1>
    <input id="username" placeholder="Username" />
    <input id="password" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>
    <p id="loginError"></p>
  </div>

  <div id="app">
    <button class="logout-btn" onclick="logout()">Logout</button>

    <h1>P&L Calendar Journal</h1>

    <div class="dashboard">
      <div class="stat"><h3>Total P&L</h3><p id="statTotal">$0</p></div>
      <div class="stat"><h3>Total Entries</h3><p id="statEntries">0</p></div>
      <div class="stat"><h3>Wins</h3><p id="statWins">0</p></div>
      <div class="stat"><h3>Losses</h3><p id="statLosses">0</p></div>
      <div class="stat"><h3>Win %</h3><p id="statWinRate">0%</p></div>
      <div class="stat"><h3>Current Streak</h3><p id="statStreak">0</p></div>
    </div>

    <div class="top">
      <button onclick="changeMonth(-1)">← Prev</button>
      <h2 id="monthYear"></h2>
      <button onclick="changeMonth(1)">Next →</button>
      <button onclick="goToday()">Today</button>
      <button onclick="exportData()">Export JSON</button>
      <input type="file" id="importFile" onchange="importData(event)" style="max-width:220px;">
    </div>

    <div class="total" id="monthlyTotal"></div>

    <div class="calendar" id="calendar"></div>

    <div class="charts">
      <div class="panel">
        <h2>Monthly Graph</h2>
        <canvas id="monthlyChart" width="500" height="250"></canvas>
      </div>

      <div class="panel">
        <h2>Year Heatmap</h2>
        <div class="heatmap" id="heatmap"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="box">
      <h2 id="selectedDateText"></h2>

      <input id="eventInput" placeholder="Entry title" />
      <select id="resultInput">
        <option value="Win">Win</option>
        <option value="Loss">Loss</option>
        <option value="Push">Push</option>
        <option value="Void">Void</option>
        <option value="Cancelled">Cancelled</option>
      </select>
      <input id="plInput" type="number" placeholder="P&L, ex: 50 or -25" />
      <textarea id="notesInput" placeholder="Notes"></textarea>
      <input id="imageInput" type="file" accept="image/*" />

      <button onclick="saveEntry()">Save Entry</button>
      <button onclick="closeModal()">Close</button>

      <div id="dayEntries"></div>
    </div>
  </div>

  <script>
    let currentDate = new Date();
    let selectedDate = null;
    let entries = JSON.parse(localStorage.getItem("journalEntries")) || {};

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === "1" && pass === "1") {
        localStorage.setItem("loggedIn", "true");
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "block";
        renderAll();
      } else {
        document.getElementById("loginError").textContent = "Wrong username or password";
      }
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      document.getElementById("loginPage").style.display = "block";
      document.getElementById("app").style.display = "none";
    }

    function checkLogin() {
      if (localStorage.getItem("loggedIn") === "true") {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("app").style.display = "block";
        renderAll();
      }
    }

    function renderAll() {
      renderCalendar();
      renderStats();
      renderChart();
      renderHeatmap();
    }

    function getDateKey(year, month, day) {
      return `${year}-${month + 1}-${day}`;
    }

    function renderCalendar() {
      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById("monthYear").textContent =
        `${currentDate.toLocaleString("default", { month: "long" })} ${year}`;

      ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach(day => {
        const div = document.createElement("div");
        div.className = "day-name";
        div.textContent = day;
        calendar.appendChild(div);
      });

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calendar.appendChild(document.createElement("div"));
      }

      let monthlyTotal = 0;
      const today = new Date();

      for (let day = 1; day <= lastDate; day++) {
        const dateKey = getDateKey(year, month, day);
        const dayBox = document.createElement("div");
        dayBox.className = "day";

        if (
          today.getFullYear() === year &&
          today.getMonth() === month &&
          today.getDate() === day
        ) {
          dayBox.classList.add("today");
        }

        dayBox.onclick = () => openModal(dateKey);

        let dayTotal = 0;
        if (entries[dateKey]) {
          entries[dateKey].forEach(entry => {
            dayTotal += Number(entry.pl || 0);
          });
        }

        monthlyTotal += dayTotal;

        dayBox.innerHTML = `
          <div class="date">${day}</div>
          ${dayTotal !== 0 ? `
            <div class="${dayTotal >= 0 ? "profit" : "loss"}">
              ${dayTotal >= 0 ? "+" : ""}$${dayTotal}
            </div>` : ""}
        `;

        if (entries[dateKey]) {
          entries[dateKey].forEach(entry => {
            dayBox.innerHTML += `
              <div class="entry">
                ${entry.event || "Entry"}<br>
                ${entry.result || ""}
              </div>
            `;
          });
        }

        calendar.appendChild(dayBox);
      }

      const totalBox = document.getElementById("monthlyTotal");
      totalBox.textContent = `Monthly Total: ${monthlyTotal >= 0 ? "+" : ""}$${monthlyTotal}`;
      totalBox.className = monthlyTotal >= 0 ? "total profit" : "total loss";
    }

    function renderStats() {
      let total = 0;
      let count = 0;
      let wins = 0;
      let losses = 0;

      Object.values(entries).forEach(day => {
        day.forEach(entry => {
          count++;
          total += Number(entry.pl || 0);
          if ((entry.result || "").toLowerCase() === "win") wins++;
          if ((entry.result || "").toLowerCase() === "loss") losses++;
        });
      });

      const winRate = wins + losses > 0 ? Math.round((wins / (wins + losses)) * 100) : 0;

      document.getElementById("statTotal").textContent = `${total >= 0 ? "+" : ""}$${total}`;
      document.getElementById("statTotal").className = total >= 0 ? "profit" : "loss";
      document.getElementById("statEntries").textContent = count;
      document.getElementById("statWins").textContent = wins;
      document.getElementById("statLosses").textContent = losses;
      document.getElementById("statWinRate").textContent = `${winRate}%`;
      document.getElementById("statStreak").textContent = getCurrentStreak();
    }

    function getCurrentStreak() {
      const dates = Object.keys(entries).sort((a, b) => new Date(b) - new Date(a));
      let streak = 0;
      let streakType = null;

      for (const date of dates) {
        let dayTotal = entries[date].reduce((sum, e) => sum + Number(e.pl || 0), 0);

        if (dayTotal === 0) continue;

        const type = dayTotal > 0 ? "win" : "loss";

        if (!streakType) streakType = type;
        if (type === streakType) streak++;
        else break;
      }

      if (streak === 0) return "0";
      return `${streak} ${streakType === "win" ? "green" : "red"}`;
    }

    function openModal(dateKey) {
      selectedDate = dateKey;
      document.getElementById("selectedDateText").textContent = dateKey;
      document.getElementById("modal").style.display = "flex";
      showDayEntries();
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
      document.getElementById("eventInput").value = "";
      document.getElementById("plInput").value = "";
      document.getElementById("notesInput").value = "";
      document.getElementById("imageInput").value = "";
    }

    function saveEntry() {
      const event = document.getElementById("eventInput").value;
      const result = document.getElementById("resultInput").value;
      const pl = document.getElementById("plInput").value || 0;
      const notes = document.getElementById("notesInput").value;
      const imageFile = document.getElementById("imageInput").files[0];

      const newEntry = { event, result, pl, notes, image: "" };

      if (imageFile) {
        const reader = new FileReader();
        reader.onload = function(e) {
          newEntry.image = e.target.result;
          finishSave(newEntry);
        };
        reader.readAsDataURL(imageFile);
      } else {
        finishSave(newEntry);
      }
    }

    function finishSave(newEntry) {
      if (!entries[selectedDate]) entries[selectedDate] = [];
      entries[selectedDate].push(newEntry);
      localStorage.setItem("journalEntries", JSON.stringify(entries));
      closeModal();
      renderAll();
    }

    function showDayEntries() {
      const container = document.getElementById("dayEntries");
      container.innerHTML = "<h3>Entries</h3>";

      if (!entries[selectedDate] || entries[selectedDate].length === 0) {
        container.innerHTML += "<p>No entries yet.</p>";
        return;
      }

      entries[selectedDate].forEach((entry, index) => {
        container.innerHTML += `
          <div class="entry">
            <strong>${entry.event || "Entry"}</strong><br>
            Result: ${entry.result}<br>
            P&L: ${Number(entry.pl) >= 0 ? "+" : ""}$${entry.pl}<br>
            ${entry.notes ? `Notes: ${entry.notes}<br>` : ""}
            ${entry.image ? `<img src="${entry.image}" class="img-preview">` : ""}
            <br><button onclick="deleteEntry('${selectedDate}', ${index})">Delete</button>
          </div>
        `;
      });
    }

    function deleteEntry(dateKey, index) {
      entries[dateKey].splice(index, 1);
      if (entries[dateKey].length === 0) delete entries[dateKey];
      localStorage.setItem("journalEntries", JSON.stringify(entries));
      showDayEntries();
      renderAll();
    }

    function changeMonth(amount) {
      currentDate.setMonth(currentDate.getMonth() + amount);
      renderAll();
    }

    function goToday() {
      currentDate = new Date();
      renderAll();
    }

    function renderChart() {
      const canvas = document.getElementById("monthlyChart");
      const ctx = canvas.getContext("2d");

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const year = currentDate.getFullYear();
      const monthlyTotals = Array(12).fill(0);

      Object.keys(entries).forEach(dateKey => {
        const date = new Date(dateKey);
        if (date.getFullYear() === year) {
          entries[dateKey].forEach(e => {
            monthlyTotals[date.getMonth()] += Number(e.pl || 0);
          });
        }
      });

      const max = Math.max(...monthlyTotals.map(Math.abs), 1);
      const barWidth = canvas.width / 12;

      ctx.font = "12px Arial";
      ctx.textAlign = "center";

      monthlyTotals.forEach((value, i) => {
        const barHeight = Math.abs(value) / max * 90;
        const x = i * barWidth + 10;
        const middle = canvas.height / 2;

        ctx.fillStyle = value >= 0 ? "#00d26a" : "#ff4d4d";
        ctx.fillRect(
          x,
          value >= 0 ? middle - barHeight : middle,
          barWidth - 18,
          barHeight
        );

        ctx.fillStyle = "white";
        ctx.fillText(
          ["J","F","M","A","M","J","J","A","S","O","N","D"][i],
          x + barWidth / 2 - 10,
          canvas.height - 15
        );
      });

      ctx.strokeStyle = "white";
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
    }

    function renderHeatmap() {
      const heatmap = document.getElementById("heatmap");
      heatmap.innerHTML = "";

      const year = currentDate.getFullYear();
      const start = new Date(year, 0, 1);

      for (let i = 0; i < 365; i++) {
        const d = new Date(start);
        d.setDate(start.getDate() + i);

        const key = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
        let total = 0;

        if (entries[key]) {
          entries[key].forEach(e => total += Number(e.pl || 0));
        }

        const cell = document.createElement("div");
        cell.className = "heat-cell";

        if (total > 0) cell.style.background = "#00d26a";
        if (total < 0) cell.style.background = "#ff4d4d";

        cell.title = `${key}: ${total >= 0 ? "+" : ""}$${total}`;
        heatmap.appendChild(cell);
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(entries, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "journal-backup.json";
      a.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        entries = JSON.parse(e.target.result);
        localStorage.setItem("journalEntries", JSON.stringify(entries));
        renderAll();
      };
      reader.readAsText(file);
    }

    checkLogin();
  </script>

</body>
</html>
